name: 서버 함수 배포
# supabase/functions 아래 코드를 바꿔 main(또는 이 브랜치)에 올리면 Supabase에 배포한다. 수동 실행도 된다.
# 필요한 비밀 값: SUPABASE_ACCESS_TOKEN, SUPABASE_PROJECT_REF
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['supabase/functions/**']

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: 배포
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          for fn in view-result submit-result invite-admin submission create-repos close-submissions; do
            supabase functions deploy "$fn" --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}" --no-verify-jwt
          done
