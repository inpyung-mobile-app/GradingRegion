name: 서버 함수 배포
# supabase/functions 아래 코드를 바꿔 main 또는 claude/project-thread-ind4t4 에 올리면 Supabase에 배포한다.
# (수동 실행은 이 파일이 main에 있어야 Actions 목록에 보인다.)
# 필요한 비밀 값: SUPABASE_ACCESS_TOKEN (프로젝트 번호는 비밀이 아니라 아래에 적어 둔다)
on:
  workflow_dispatch:
  push:
    branches: [main, claude/project-thread-ind4t4]
    paths: ['supabase/functions/**', '.github/workflows/deploy-functions.yml']

env:
  PROJECT_REF: ppudygdyucnyzojcvyel

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.40.7
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: 비밀 값 확인
        env:
          T: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$T" ]; then echo "::error::저장소 Secrets에 SUPABASE_ACCESS_TOKEN 을 넣은 뒤 이 실행을 Re-run 해 주세요."; exit 1; fi
      - name: 배포
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          for fn in view-result submit-result invite-admin submission create-repos close-submissions; do
            supabase functions deploy "$fn" --project-ref "$PROJECT_REF" --no-verify-jwt --use-api --yes
          done
