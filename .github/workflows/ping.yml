name: 일시정지 방지 핑
# 무료 Supabase 프로젝트는 일주일 동안 쓰지 않으면 멈춘다. 3일마다 가벼운 호출을 보낸다.
# 필요한 비밀 값: SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY
on:
  schedule:
    - cron: '0 3 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: ping 호출
        env:
          URL: ${{ secrets.SUPABASE_URL }}
          KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          curl -fsS -X POST "$URL/rest/v1/rpc/ping" -H "apikey: $KEY" -H "Authorization: Bearer $KEY" -H "Content-Type: application/json" -d '{}'
